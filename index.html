* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: spds, 'SPDS', sans-serif; background: #fff; min-height: 100vh; padding: 20px; color: #000; }
.container { max-width: 1160px; margin: 0 auto; }
h1 { font-size: 42px; margin-bottom: 4px; }
.subtitle { font-size: 23px; color: #555; margin-bottom: 20px; }
.card { background: #fff; border-radius: 0; padding: 20px; margin-bottom: 14px; border: 1px solid #000; }
.card h3 { font-size: 24px; color: #000; margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
input, button, table { font-family: inherit; }
* { font-weight: 700 !important; font-synthesis: weight; }
label { display: block; font-size: 20px; color: #333; margin-bottom: 5px; }
input[type="number"] { width: 100%; padding: 10px 12px; border: 1px solid #000; border-radius: 0; font-size: 26px; font-weight: 600; color: #000; background: #fff; }
input[type="number"]:focus { outline: none; border: 2px solid #000; }
.btn-primary { width: 100%; padding: 16px; background: #fff; color: #000; border: 2px solid #000; border-radius: 0; font-size: 28px; font-weight: 700; cursor: pointer; margin-bottom: 14px; }
.btn-primary:hover { background: #000; color: #fff; }
.btn-add { padding: 8px 16px; background: #fff; color: #000; border: 1px solid #000; border-radius: 0; font-size: 23px; font-weight: 600; cursor: pointer; }
.btn-add:hover { background: #000; color: #fff; }
.btn-remove { padding: 8px 10px; background: #fff; color: #000; border: 1px solid #000; border-radius: 0; font-size: 23px; cursor: pointer; width: 36px; font-weight: 700; }
.btn-remove:hover { background: #000; color: #fff; }
.part-row, .stock-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; }
.part-row, .part-head { grid-template-columns: 56px 1fr 1fr 36px; }
.part-row { align-items: stretch; }
.part-row .btn-remove { align-self: stretch; }
.part-head { display: grid; gap: 10px; font-size: 20px; color: #333; margin-bottom: 6px; }
.pos-cell { display: flex; align-items: center; justify-content: center; padding: 10px 0; border: 1px solid #000; border-radius: 0; font-size: 26px; font-weight: 600; background: #fff; }
.stat-box { text-align: center; padding: 14px; background: #fff; border: 1px solid #000; }
.stat-box .value { font-size: 62px; font-weight: 700; color: #000; }
.stat-box .label { font-size: 20px; color: #333; }
.stock-visual { position: relative; height: 44px; background: #fff; border: 1px solid #000; margin-bottom: 10px; }
.stock-visual .segment { position: absolute; height: 100%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 23px; font-weight: 700; border-right: 1px solid #000; background: #fff; overflow: hidden; white-space: nowrap; }
.stock-visual .segment:last-child { border-right: none; }
.stock-visual .waste { position: absolute; right: 0; height: 100%; background: repeating-linear-gradient(45deg, #fff, #fff 3px, #ccc 3px, #ccc 6px); display: flex; align-items: center; justify-content: center; color: #000; font-size: 17px; font-weight: 600; border-left: 1px dashed #000; }
.header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stats-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid #000; font-size: 23px; color: #000; line-height: 1.8; }
.warning { text-align: center; color: #000; padding: 20px; border: 2px solid #000; }
.badge-count { display: inline-block; background: #000; color: #fff; font-size: 23px; font-weight: 700; padding: 4px 12px; border-radius: 0; margin-left: 8px; }
.parts-table { width: 100%; border-collapse: collapse; font-size: 23px; margin-top: 8px; }
.parts-table th { text-align: left; padding: 6px 0; border-bottom: 1px solid #000; font-weight: 600; }
.parts-table td { text-align: left; padding: 5px 0; border-bottom: 1px solid #e0e0e0; }
.parts-table th:nth-child(1), .parts-table td:nth-child(1) { width: 15%; }
.parts-table td:nth-child(3) { text-align: left; }
.btn-export { padding: 12px 24px; background: #fff; color: #000; border: 2px solid #000; border-radius: 0; font-size: 23px; cursor: pointer; }
.btn-export:hover { background: #000; color: #fff; }
.map-card { padding: 20px 24px 8px; }
.map-title { text-align: center; font-size: 34px; margin: 4px 0 18px; }
.scheme-title { font-size: 26px; margin: 14px 0 10px; }
.map-card .stock-visual { height: 44px; margin-bottom: 18px; }

<body>
<div class="container">
  <div class="top-bar">
    <h1 data-i18n="title">Линейный раскрой материалов</h1>
    <div class="top-actions">
      <button class="btn-add" id="btnClear" data-i18n="clear">Очистить</button>
      <button class="btn-add" id="btnTheme"></button>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>
  <p class="subtitle" data-i18n="subtitle">Введите параметры и нажмите «Рассчитать раскрой»</p>

  <div class="card">
    <label data-i18n="materialName">Наименование материала</label>
    <input type="text" id="materialName" autocomplete="off">
  </div>

  <div class="card">
    <div class="header-flex">
      <h3 data-i18n="stocksTitle">Заготовки (разные длины)</h3>
      <button class="btn-add" id="btnAddStock" data-i18n="addStock">+ Заготовка</button>
    </div>
    <div id="stocksTable"></div>
  </div>

  <div class="card">
    <div class="header-flex">
      <h3 data-i18n="partsTitle">Детали для раскроя</h3>
    </div>
    <div class="header-flex" style="margin-bottom: 8px;">
      <label style="margin: 0;" data-i18n="pasteLabel">Вставка из таблицы (Поз. / Длина / Кол-во)</label>
      <button class="btn-add" id="btnFillParts" data-i18n="fill">Заполнить</button>
    </div>
    <textarea id="pasteBox" rows="4" data-i18n-ph="pastePh" placeholder="Вставьте сюда строки из Excel: Поз. Длина Кол-во"></textarea>
    <div class="part-head-wrap">
      <div class="part-head"><span data-i18n="hPos">Поз.</span><span data-i18n="hLen">Длина, мм</span><span data-i18n="hQty">Кол-во, шт</span><span></span></div>
      <button class="btn-add" id="btnAddPart" data-i18n="addPart">+ Деталь</button>
    </div>
    <div id="partsTable"></div>
  </div>

  <div class="card">
    <h3 data-i18n="params">Общие параметры</h3>
    <div class="grid-2">
      <div>
        <label data-i18n="kerf">Толщина реза, мм</label>
        <input type="number" id="kerf" value="5" min="0">
      </div>
    </div>
  </div>

  <button class="btn-primary" id="btnCalculate" data-i18n="calc">Рассчитать раскрой</button>

  <div id="results"></div>
</div>

<script>
var lastPatterns = [];
var lastKerf = 0;

var I18N = {
  ru: {
    themeDark: 'Тёмная', themeLight: 'Светлая', clear: 'Очистить', materialName: 'Наименование материала',
    title: 'Линейный раскрой материалов',
    subtitle: 'Введите параметры и нажмите «Рассчитать раскрой»',
    stocksTitle: 'Заготовки (разные длины)', addStock: '+ Заготовка',
    partsTitle: 'Детали для раскроя', addPart: '+ Деталь',
    pasteLabel: 'Вставка из таблицы (Поз. / Длина / Кол-во)', fill: 'Заполнить',
    pastePh: 'Вставьте сюда строки из Excel: Поз. Длина Кол-во',
    hPos: 'Поз.', hLen: 'Длина, мм', hQty: 'Кол-во, шт',
    params: 'Общие параметры', kerf: 'Толщина реза, мм', calc: 'Рассчитать раскрой',
    phStockLen: 'Длина заготовки, мм', phStockQty: 'Кол-во на складе',
    phPartLen: 'Длина детали, мм', phPartQty: 'Кол-во',
    alertCalcFirst: 'Сначала выполните расчёт раскроя!',
    alertParse: 'Не удалось распознать данные. Нужны колонки: Поз., Длина, Кол-во.',
    noStock: 'Добавьте хотя бы одну заготовку', noPart: 'Добавьте хотя бы одну деталь',
    summary: 'Итоги раскроя', stocksUsed: 'заготовок использовано', utilization: 'процент использования',
    placedLine: 'Деталей размещено: <b>{a} из {b} шт</b>',
    unplacedLine: 'Не размещено: <b>{n} шт</b> — не хватило заготовок!',
    stockLen: 'Длина заготовок', partsLen: 'Длина деталей', wasteLen: 'Длина отходов', mm: 'мм',
    cutsLine: 'Количество резов: <b>{n} шт</b>', patternsLine: 'Уникальных схем раскроя',
    warnNotEnough: 'Не хватило заготовок для {n} деталей. Добавьте ещё заготовок или увеличьте их длину.',
    mapUsed: 'Использовано заготовок (мм):', mapLine: '{len} x {n} шт. = {tot}',
    mapParts: 'Отрезки', thPos: 'Поз.', thLen: 'Длина, мм', thQty: 'Кол-во, шт.', thNote: 'Примечание',
    scheme: 'Схема раскроя – {len} мм', exportBtn: '⬇ Скачать DXF'
  },
  en: {
    themeDark: 'Dark', themeLight: 'Light', clear: 'Clear', materialName: 'Material name',
    title: 'Linear cutting of materials',
    subtitle: 'Enter the parameters and press “Calculate cutting”',
    stocksTitle: 'Stock pieces (various lengths)', addStock: '+ Stock',
    partsTitle: 'Parts to cut', addPart: '+ Part',
    pasteLabel: 'Paste from a table (Pos. / Length / Qty)', fill: 'Fill',
    pastePh: 'Paste rows from Excel here: Pos. Length Qty',
    hPos: 'Pos.', hLen: 'Length, mm', hQty: 'Qty, pcs',
    params: 'General parameters', kerf: 'Kerf (cut width), mm', calc: 'Calculate cutting',
    phStockLen: 'Stock length, mm', phStockQty: 'Qty in stock',
    phPartLen: 'Part length, mm', phPartQty: 'Qty',
    alertCalcFirst: 'Run the calculation first!',
    alertParse: 'Could not recognize the data. Columns required: Pos., Length, Qty.',
    noStock: 'Add at least one stock piece', noPart: 'Add at least one part',
    summary: 'Cutting summary', stocksUsed: 'stock pieces used', utilization: 'utilization',
    placedLine: 'Parts placed: <b>{a} of {b} pcs</b>',
    unplacedLine: 'Not placed: <b>{n} pcs</b> — not enough stock!',
    stockLen: 'Stock length', partsLen: 'Parts length', wasteLen: 'Waste length', mm: 'mm',
    cutsLine: 'Number of cuts: <b>{n} pcs</b>', patternsLine: 'Unique cutting patterns',
    warnNotEnough: 'Not enough stock for {n} parts. Add more stock or increase its length.',
    mapUsed: 'Stock used (mm):', mapLine: '{len} x {n} pcs = {tot}',
    mapParts: 'Cut pieces', thPos: 'Pos.', thLen: 'Length, mm', thQty: 'Qty, pcs', thNote: 'Note',
    scheme: 'Cutting pattern – {len} mm', exportBtn: '⬇ Download DXF'
  }
};
var lang = 'ru';
try { if (localStorage.getItem('lc_lang') === 'en') lang = 'en'; } catch (e) {}
function t(k, o) {
  var v = I18N[lang][k];
  if (!o) return v;
  return v.replace(/\{(\w+)\}/g, function(m, key) { return o[key]; });
}
function nf(n) { return n.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US'); }

function updateThemeBtn() {
  var dark = document.documentElement.classList.contains('dark');
  document.getElementById('btnTheme').textContent = dark ? t('themeLight') : t('themeDark');
}

function toggleTheme() {
  var dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('lc_theme', dark ? 'dark' : 'light'); } catch (e) {}
  updateThemeBtn();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(function(el) { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  var ph = { '.stock-len': 'phStockLen', '.stock-qty': 'phStockQty', '.part-len': 'phPartLen', '.part-qty': 'phPartQty' };
  for (var sel in ph) {
    document.querySelectorAll(sel).forEach(function(el) { el.placeholder = t(ph[sel]); });
  }
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });
  updateThemeBtn();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lc_lang', l); } catch (e) {}
  applyLang();
  if (document.getElementById('results').innerHTML) calculate();
}

function addStockRow(len, qty) {
  var id = Date.now() + Math.random();
  var row = document.createElement('div');
  row.id = 'stock-row-' + id;
  row.className = 'stock-row';
  row.innerHTML =
    '<input type="number" class="stock-len" placeholder="' + t('phStockLen') + '" value="' + (len || '') + '" min="1">' +
    '<input type="number" class="stock-qty" placeholder="' + t('phStockQty') + '" value="' + (qty || '') + '" min="1">' +
    '<button class="btn-remove">✕</button>';
  document.getElementById('stocksTable').appendChild(row);
  row.querySelector('.btn-remove').onclick = function() { row.remove(); };
}

function renumberParts() {
  var cells = document.querySelectorAll('#partsTable .pos-cell');
  for (var i = 0; i < cells.length; i++) cells[i].textContent = i + 1;
}

function addPartRow(len, qty, pos) {
  var id = Date.now() + Math.random();
  var row = document.createElement('div');
  row.id = 'part-row-' + id;
  row.className = 'part-row';
  row.innerHTML =
    '<div class="pos-cell"></div>' +
    '<input type="number" class="part-len" placeholder="' + t('phPartLen') + '" value="' + (len || '') + '" min="1">' +
    '<input type="number" class="part-qty" placeholder="' + t('phPartQty') + '" value="' + (qty || '') + '" min="1">' +
    '<button class="btn-remove">✕</button>';
  document.getElementById('partsTable').appendChild(row);
  row.querySelector('.btn-remove').onclick = function() { row.remove(); renumberParts(); };
  if (pos !== undefined && pos !== null) row.querySelector('.pos-cell').textContent = pos;
  else renumberParts();
}

function dxfFileName() {
  var name = (document.getElementById('materialName').value || '').trim();
  name = name.replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').replace(/[. ]+$/, function(m) { return m.replace(/./g, '_'); });
  if (name.length > 120) name = name.slice(0, 120);
  return (name || 'cutting_map') + '.dxf';
}

function clearAll() {
  document.getElementById('materialName').value = '';
  document.getElementById('stocksTable').innerHTML = '';
  document.getElementById('partsTable').innerHTML = '';
  document.getElementById('pasteBox').value = '';
  document.getElementById('results').innerHTML = '';
  lastPatterns = [];
  addStockRow();
  addPartRow();
}

function exportDXF() {
  var src = document.querySelector('#results .map-card');
  if (!src) { alert(t('alertCalcFirst')); return; }
  // DXF строится по копии карты в «десктопной» вёрстке, чтобы результат не зависел от размера экрана
  var box = document.createElement('div');
  box.style.cssText = 'position: absolute; left: -20000px; top: 0; width: 1160px;';
  var root = src.cloneNode(true);
  box.appendChild(root);
  document.body.appendChild(box);
  var r0 = root.getBoundingClientRect();
  var TH = 2.5;                    // высота текста, мм
  var FRAME_W = 175;               // ширина рамки в DXF, мм
  var k = FRAME_W / r0.width;      // коэффициент: пиксели экрана -> мм чертежа
  var d = [];
  function r(v) { return Math.round(v * 1000) / 1000; }
  function nx(v) { return r((v - r0.left) * k); }
  function ny(v) { return r(-(v - r0.top) * k); }
  function colorOf(c) {
    var m = c.match(/[\d.]+/g);
    if (!m) return 7;
    if (m.length > 3 && parseFloat(m[3]) === 0) return -1;
    return ((+m[0] + +m[1] + +m[2]) / 3) > 170 ? 8 : 7;
  }
  function enc(t) {
    return t.replace(/[^\x00-\x7F]/g, function(c) {
      return '\\U+' + ('0000' + c.charCodeAt(0).toString(16).toUpperCase()).slice(-4);
    });
  }
  function line(x1, y1, x2, y2, col, lt) {
    d.push('0', 'LINE', '8', '0', '62', col);
    if (lt) d.push('6', lt);
    d.push('10', r(x1), '20', r(y1), '30', 0, '11', r(x2), '21', r(y2), '31', 0);
  }

  var els = [root].concat(Array.prototype.slice.call(root.querySelectorAll('*')));
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    var rc = el.getBoundingClientRect();
    if (rc.width === 0 || rc.height === 0) continue;
    var cs = getComputedStyle(el);
    var x0 = nx(rc.left), x1 = nx(rc.right), yT = ny(rc.top), yB = ny(rc.bottom);
    var sides = {
      Top: [x0, yT, x1, yT], Right: [x1, yT, x1, yB],
      Bottom: [x0, yB, x1, yB], Left: [x0, yT, x0, yB]
    };
    for (var sd in sides) {
      var w = parseFloat(cs['border' + sd + 'Width']);
      var st = cs['border' + sd + 'Style'];
      if (w > 0 && st !== 'none') {
        var col = colorOf(cs['border' + sd + 'Color']);
        if (col < 0) continue;
        var q = sides[sd];
        line(q[0], q[1], q[2], q[3], col, null);
      }
    }
    if (el.classList.contains('waste')) {
      var cxw = (x0 + x1) / 2, midY = (yT + yB) / 2;
      var tw = el.textContent.trim().length * TH * 0.6, m = 1;
      var hb = [cxw - tw / 2 - m, midY - TH / 2 - m, cxw + tw / 2 + m, midY + TH / 2 + m];
      var step = 6 * Math.SQRT2 * k;
      for (var c = yB - x1; c <= yT - x0; c += step) {
        var a = Math.max(x0, yB - c), b = Math.min(x1, yT - c);
        if (b <= a) continue;
        var lo = Math.max(hb[0], hb[1] - c), hi = Math.min(hb[2], hb[3] - c);
        if (hi > lo) {
          if (lo > a) { var e1 = Math.min(lo, b); line(a, a + c, e1, e1 + c, 7); }
          if (hi < b) { var s1 = Math.max(hi, a); line(s1, s1 + c, b, b + c, 7); }
        } else {
          line(a, a + c, b, b + c, 7);
        }
      }
    }
  }

  var tw2 = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  var n;
  while ((n = tw2.nextNode())) {
    var txt = n.nodeValue.replace(/\s+/g, ' ').trim();   // одна строка, без переносов
    if (!txt) continue;
    var p = n.parentElement;
    var rg = document.createRange();
    rg.selectNodeContents(n);
    var rr = rg.getBoundingClientRect();
    if (!rr.width) continue;
    var pcs = getComputedStyle(p);
    var al = (pcs.textAlign === 'center' || pcs.justifyContent === 'center') ? 1 : (pcs.textAlign === 'right' ? 2 : 0);
    var px = al === 1 ? nx((rr.left + rr.right) / 2) : (al === 2 ? nx(rr.right) : nx(rr.left));
    var py = ny((rr.top + rr.bottom) / 2);
    d.push('0', 'TEXT', '8', '0', '62', 7, '7', 'SPDS',
      '10', px, '20', py, '30', 0, '40', TH, '1', enc(txt),
      '72', al, '11', px, '21', py, '31', 0, '73', 2);
  }

  // наименование материала над рамкой по центру
  var matName = (document.getElementById('materialName').value || '').replace(/\s+/g, ' ').trim();
  if (matName) {
    var mx = r(FRAME_W / 2);
    d.push('0', 'TEXT', '8', '0', '62', 7, '7', 'SPDS',
      '10', mx, '20', 5, '30', 0, '40', TH, '1', enc(matName),
      '72', 1, '11', mx, '21', 5, '31', 0, '73', 2);
  }

  var head = [
    '0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','0','ENDSEC',
    '0','SECTION','2','TABLES',
    '0','TABLE','2','LAYER','70',1,'0','LAYER','2','0','70',0,'62',7,'6','CONTINUOUS','0','ENDTAB',
    '0','TABLE','2','STYLE','70',1,
    '0','STYLE','2','SPDS','70',0,'40',0,'41',1,'50',0,'71',0,'42',2.5,'3','GOST2304A_1.ttf','4','',
    '0','ENDTAB',
    '0','ENDSEC','0','SECTION','2','ENTITIES'
  ];
  var dxf = head.concat(d, ['0', 'ENDSEC', '0', 'EOF']);
  var blob = new Blob([dxf.join('\n')], { type: 'application/dxf' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = dxfFileName();
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  document.body.removeChild(box);
}

function fillPartsFromText(text) {
  var rows = [];
  text.split(/\r?\n/).forEach(function(line) {
    if (!line.trim()) return;
    var cells = line.indexOf('\t') >= 0 ? line.split('\t') : (line.indexOf(';') >= 0 ? line.split(';') : line.trim().split(/\s+/));
    var nums = [];
    cells.forEach(function(c) {
      var digits = c.replace(/[^\d]/g, '');
      if (digits !== '') nums.push(parseInt(digits, 10));
    });
    if (nums.length >= 3) rows.push({ pos: nums[0], len: nums[1], qty: nums[2] });
    else if (nums.length === 2) rows.push({ pos: null, len: nums[0], qty: nums[1] });
  });
  if (!rows.length) return false;
  document.getElementById('partsTable').innerHTML = '';
  rows.forEach(function(r) { addPartRow(r.len, r.qty, r.pos); });
  if (rows.some(function(r) { return r.pos === null; })) renumberParts();
  return true;
}

function calculate() {
  var kerf = parseInt(document.getElementById('kerf').value) || 0;
  lastKerf = kerf;

  var stocksAvailable = [];
  var stockRowsEl = document.querySelectorAll('#stocksTable > div');
  for (var i = 0; i < stockRowsEl.length; i++) {
    var row = stockRowsEl[i];
    var len = parseInt(row.querySelector('.stock-len').value);
    var qty = parseInt(row.querySelector('.stock-qty').value);
    if (len && qty && len > 0 && qty > 0) {
      for (var j = 0; j < qty; j++) stocksAvailable.push({ len: len, id: stocksAvailable.length });
    }
  }

  if (stocksAvailable.length === 0) {
    document.getElementById('results').innerHTML = '<div class="card warning">' + t('noStock') + '</div>';
    return;
  }

  var parts = [];
  var partsList = [];
  var partRowsEl = document.querySelectorAll('#partsTable > div');
  for (var i = 0; i < partRowsEl.length; i++) {
    var row = partRowsEl[i];
    var pos = parseInt(row.querySelector('.pos-cell').textContent);
    var len = parseInt(row.querySelector('.part-len').value);
    var qty = parseInt(row.querySelector('.part-qty').value);
    if (len && qty && len > 0 && qty > 0) {
      partsList.push({ pos: pos, len: len, qty: qty });
      for (var j = 0; j < qty; j++) parts.push({ pos: pos, len: len });
    }
  }

  if (parts.length === 0) {
    document.getElementById('results').innerHTML = '<div class="card warning">' + t('noPart') + '</div>';
    return;
  }

  // список деталей в отчёте — по порядку позиций
  partsList.sort(function(a, b) { return a.pos - b.pos; });

  parts.sort(function(a, b) { return b.len - a.len; });
  stocksAvailable.sort(function(a, b) { return b.len - a.len; });

  var usedStocks = [];
  var remainingStocks = stocksAvailable.slice();

  for (var pi = 0; pi < parts.length; pi++) {
    var part = parts[pi];
    var placed = false;

    for (var si = 0; si < usedStocks.length; si++) {
      var s = usedStocks[si];
      var used = 0;
      for (var pi2 = 0; pi2 < s.parts.length; pi2++) {
        used += s.parts[pi2].len;
        if (pi2 < s.parts.length - 1) used += kerf;
      }
      if (used + kerf + part.len <= s.stockLen) {
        s.parts.push(part);
        placed = true;
        break;
      }
    }

    if (!placed) {
      var bestStockIdx = -1;
      var bestStockLen = Infinity;
      for (var ri = 0; ri < remainingStocks.length; ri++) {
        if (remainingStocks[ri].len >= part.len && remainingStocks[ri].len < bestStockLen) {
          bestStockIdx = ri;
          bestStockLen = remainingStocks[ri].len;
        }
      }
      if (bestStockIdx >= 0) {
        var stock = remainingStocks.splice(bestStockIdx, 1)[0];
        usedStocks.push({ stockLen: stock.len, parts: [part] });
      }
    }
  }

  var totalPartsNeeded = parts.length;
  var totalPartsPlaced = 0;
  for (var i = 0; i < usedStocks.length; i++) totalPartsPlaced += usedStocks[i].parts.length;
  var unplaced = totalPartsNeeded - totalPartsPlaced;

  var totalStockLen = 0, totalPartsLen = 0, totalKerf = 0, totalCuts = 0;
  for (var i = 0; i < usedStocks.length; i++) {
    totalStockLen += usedStocks[i].stockLen;
    for (var j = 0; j < usedStocks[i].parts.length; j++) totalPartsLen += usedStocks[i].parts[j].len;
    totalKerf += Math.max(0, usedStocks[i].parts.length - 1) * kerf;
    totalCuts += Math.max(0, usedStocks[i].parts.length - 1);
  }
  var totalWaste = totalStockLen - totalPartsLen - totalKerf;
  var wastePercent = totalStockLen > 0 ? ((totalWaste / totalStockLen) * 100).toFixed(1) : 0;
  var usePercent = totalStockLen > 0 ? (((totalStockLen - totalWaste) / totalStockLen) * 100).toFixed(1) : 0;

  var patternMap = {};
  for (var i = 0; i < usedStocks.length; i++) {
    var st = usedStocks[i];
    var partKeys = [];
    for (var j = 0; j < st.parts.length; j++) partKeys.push(st.parts[j].pos + ':' + st.parts[j].len);
    var signature = st.stockLen + '|' + partKeys.join(',');
    if (!patternMap[signature]) {
      var pw = 0;
      for (var j = 0; j < st.parts.length; j++) pw += st.parts[j].len;
      patternMap[signature] = {
        stockLen: st.stockLen,
        parts: st.parts,
        count: 0,
        waste: st.stockLen - pw - Math.max(0, st.parts.length - 1) * kerf
      };
    }
    patternMap[signature].count++;
  }

  var patterns = [];
  for (var key in patternMap) patterns.push(patternMap[key]);
  patterns.sort(function(a, b) {
    if (b.stockLen !== a.stockLen) return b.stockLen - a.stockLen;
    return b.count - a.count;
  });
  lastPatterns = patterns;

  var html = '<div class="card"><h3>' + t('summary') + '</h3><div class="stats-grid">';
  html += '<div class="stat-box"><div class="value">' + usedStocks.length + '</div><div class="label">' + t('stocksUsed') + '</div></div>';
  html += '<div class="stat-box"><div class="value">' + usePercent + '%</div><div class="label">' + t('utilization') + '</div></div>';
  html += '</div><div class="stats-detail">';
  html += '<div>' + t('placedLine', { a: totalPartsPlaced, b: totalPartsNeeded }) + '</div>';
  if (unplaced > 0) html += '<div class="unplaced">' + t('unplacedLine', { n: unplaced }) + '</div>';
  html += '<div>' + t('stockLen') + ': <b>' + nf(totalStockLen) + ' ' + t('mm') + '</b></div>';
  html += '<div>' + t('partsLen') + ': <b>' + nf(totalPartsLen) + ' ' + t('mm') + '</b></div>';
  html += '<div>' + t('wasteLen') + ': <b>' + nf(totalWaste) + ' ' + t('mm') + '</b></div>';
  html += '<div>' + t('cutsLine', { n: totalCuts }) + '</div>';
  html += '<div>' + t('patternsLine') + ': <b>' + patterns.length + '</b></div></div>';
  html += '</div>';

  if (unplaced > 0) {
    html += '<div class="card warning">' + t('warnNotEnough', { n: unplaced }) + '</div>';
  }

  html += '<div class="card map-card">';
  var groups = [], gmap = {};
  for (var gi = 0; gi < patterns.length; gi++) {
    var gp = patterns[gi];
    if (!gmap[gp.stockLen]) { gmap[gp.stockLen] = { len: gp.stockLen, count: 0, pats: [] }; groups.push(gmap[gp.stockLen]); }
    gmap[gp.stockLen].count += gp.count;
    gmap[gp.stockLen].pats.push(gp);
  }
  html += '<div class="m-head">' + t('mapUsed') + '</div>';
  groups.forEach(function(g) {
    html += '<div class="m-line">' + t('mapLine', { len: g.len, n: g.count, tot: g.len * g.count }) + '</div>';
  });
  html += '<div class="m-head">' + t('mapParts') + '</div>';
  html += '<table class="m-table"><thead><tr><th style="width: 12%">' + t('thPos') + '</th><th style="width: 29%">' + t('thLen') + '</th><th style="width: 29%">' + t('thQty') + '</th><th>' + t('thNote') + '</th></tr></thead><tbody>';
  partsList.forEach(function(p) {
    html += '<tr><td>' + p.pos + '</td><td>' + p.len + '</td><td>' + p.qty + '</td><td></td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="m-grid">';
  groups.forEach(function(g) {
    html += '<div class="m-head">' + t('scheme', { len: g.len }) + '</div>';
    g.pats.forEach(function(pat) {
      var used = 0;
      for (var i = 0; i < pat.parts.length; i++) {
        used += pat.parts[i].len;
        if (i < pat.parts.length - 1) used += kerf;
      }
      var waste = pat.stockLen - used;
      html += '<div class="m-row"><div class="m-count">' + pat.count + ' x</div><div class="stock-visual">';
      var offset = 0, pIdx = 0;
      while (pIdx < pat.parts.length) {
        var runLen = pat.parts[pIdx].len, cnt = 1;
        while (pIdx + cnt < pat.parts.length && pat.parts[pIdx + cnt].len === runLen) cnt++;
        var runW = runLen * cnt + kerf * (cnt - 1);
        html += '<div class="segment" style="left: ' + (offset / pat.stockLen * 100) + '%; width: ' + (runW / pat.stockLen * 100) + '%;">' + runLen + (cnt > 1 ? ' (x' + cnt + ')' : '') + '</div>';
        offset += runW + kerf;
        pIdx += cnt;
      }
      if (waste > 0) html += '<div class="waste" style="width: ' + (waste / pat.stockLen * 100) + '%;">' + waste + '</div>';
      html += '</div></div>';
    });
  });
  html += '</div></div>';

  html += '<div class="no-export" style="margin: 14px 0 20px;"><button class="btn-export" id="btnExportDXF">' + t('exportBtn') + '</button></div>';
  document.getElementById('results').innerHTML = html;
  document.getElementById('btnExportDXF').onclick = exportDXF;
}

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.onclick = function() { setLang(b.getAttribute('data-lang')); };
  });
  var cont = document.querySelector('.container');
  function updMobile() { cont.classList.toggle('mobile', window.innerWidth < 760); }
  updMobile();
  window.addEventListener('resize', updMobile);
  applyLang();
  document.getElementById('btnAddStock').onclick = function() { addStockRow(); };
  document.getElementById('btnAddPart').onclick = function() { addPartRow(); };
  document.getElementById('btnCalculate').onclick = calculate;
  document.getElementById('btnClear').onclick = clearAll;
  document.getElementById('btnTheme').onclick = toggleTheme;
  var pasteBox = document.getElementById('pasteBox');
  pasteBox.addEventListener('paste', function() {
    setTimeout(function() { fillPartsFromText(pasteBox.value); }, 0);
  });
  document.getElementById('btnFillParts').onclick = function() {
    if (!fillPartsFromText(pasteBox.value)) alert(t('alertParse'));
  };

  addStockRow(6000, 100);
  addPartRow(1500, 40);
  addPartRow(1200, 30);
  addPartRow(1100, 20);
});
</script>
